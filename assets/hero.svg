<svg xmlns="http://www.w3.org/2000/svg" width="900" height="292" viewBox="0 0 900 292" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Richard Winner Duvor — Cyber and Cloud Security Engineer</title>
  <desc id="desc">Security engineering profile banner with an animated signal map.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08141D"/>
      <stop offset="0.58" stop-color="#0A1721"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#50E3C2"/>
      <stop offset="1" stop-color="#66A3FF"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop stop-color="#50E3C2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#50E3C2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#8EC5D1" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="292" rx="22"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="292" fill="url(#surface)"/>
    <rect width="900" height="292" fill="url(#grid)"/>
    <circle cx="746" cy="145" r="190" fill="url(#radar)"/>
    <path d="M0 1H900" stroke="url(#accent)" stroke-opacity="0.9"/>
    <path d="M596 0V292" stroke="#A7C5CE" stroke-opacity="0.10"/>

    <text x="42" y="53" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,monospace" font-size="12" font-weight="600" letter-spacing="2.8" fill="#50E3C2">RW / SECURITY ENGINEERING</text>
    <text x="40" y="115" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="45" font-weight="750" letter-spacing="-1.5" fill="#F2FAF8">Richard Winner Duvor</text>
    <text x="42" y="153" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="url(#accent)">Cyber &amp; Cloud Security Engineer</text>
    <text x="42" y="187" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="14.5" fill="#9DB1BB">I investigate threats, engineer detections, and harden cloud infrastructure.</text>

    <g transform="translate(42 220)">
      <rect width="130" height="30" rx="15" fill="#50E3C2" fill-opacity="0.08" stroke="#50E3C2" stroke-opacity="0.32"/>
      <circle cx="16" cy="15" r="3" fill="#50E3C2"/>
      <text x="27" y="19.5" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,monospace" font-size="11.5" fill="#CDE9E3">SOC OPERATIONS</text>
      <rect x="140" width="104" height="30" rx="15" fill="#66A3FF" fill-opacity="0.08" stroke="#66A3FF" stroke-opacity="0.30"/>
      <circle cx="156" cy="15" r="3" fill="#66A3FF"/>
      <text x="167" y="19.5" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,monospace" font-size="11.5" fill="#D3E2FF">PENTEST</text>
      <rect x="254" width="104" height="30" rx="15" fill="#FFB86B" fill-opacity="0.07" stroke="#FFB86B" stroke-opacity="0.28"/>
      <circle cx="270" cy="15" r="3" fill="#FFB86B"/>
      <text x="281" y="19.5" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,monospace" font-size="11.5" fill="#FFE2C2">APPSEC</text>
    </g>

    <g transform="translate(746 145)">
      <circle r="104" stroke="#72A6B4" stroke-opacity="0.14"/>
      <circle r="76" stroke="#72A6B4" stroke-opacity="0.18" stroke-dasharray="3 7"/>
      <circle r="46" stroke="#50E3C2" stroke-opacity="0.22"/>
      <path d="M0 0L0-103A103 103 0 0 1 73-73Z" fill="#50E3C2" fill-opacity="0.07" class="motion">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
      </path>
      <path d="M-91 36L-44-15L8 28L67-52L96 4" stroke="#66A3FF" stroke-opacity="0.55" stroke-width="1.5"/>
      <g fill="#50E3C2" filter="url(#glow)">
        <circle cx="-91" cy="36" r="3"/><circle cx="-44" cy="-15" r="4"/><circle cx="8" cy="28" r="3"/><circle cx="67" cy="-52" r="4"/><circle cx="96" cy="4" r="3"/>
      </g>
      <circle r="7" fill="#50E3C2" fill-opacity="0.16" stroke="#50E3C2"/>
      <circle r="16" stroke="#50E3C2" stroke-opacity="0" class="motion">
        <animate attributeName="r" values="9;24" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="624" y="265" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing="1.2" fill="#718994">SIGNAL: ACTIVE</text>
    <circle cx="851" cy="261" r="4" fill="#50E3C2"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="290.5" rx="21.25" stroke="#8EC5D1" stroke-opacity="0.22" stroke-width="1.5"/>
</svg>